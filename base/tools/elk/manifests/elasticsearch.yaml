apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: elasticsearch
  namespace: logging
spec:
  version: 8.17.0
  nodeSets:
    - name: default
      count: 1
      config:
        node.store.allow_mmap: false
        xpack.security.enabled: true
      podTemplate:
        spec:
          nodeSelector:
            workload: apps
          containers:
            - name: elasticsearch
              resources:
                # ECK impose requests.memory == limits.memory (heap JVM = 50% de cette valeur).
                # 356Mi => OOMKilled au demarrage. Minimum realiste ES 8.x ~2Gi.
                # cpu: seul memory doit avoir request == limit, pas cpu.
                requests:
                  cpu: 250m
                  memory: 2080Mi
                limits:
                  cpu: 700m
                  memory: 2080Mi
      volumeClaimTemplates:
        - metadata:
            name: elasticsearch-data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 10Gi
            storageClassName: gp3
