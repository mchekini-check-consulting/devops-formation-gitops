apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: elasticsearch
  namespace: logging
spec:
  version: 8.17.0
  nodeSets:
    - name: default
      count: 1
      config:
        node.store.allow_mmap: false
        xpack.security.enabled: true
      podTemplate:
        spec:
          nodeSelector:
            workload: apps
          containers:
            - name: elasticsearch
              resources:
                # ECK impose requests.memory == limits.memory (heap JVM derivee de cette valeur)
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: "100m"
                  memory: 256Mi
      volumeClaimTemplates:
        - metadata:
            name: elasticsearch-data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 10Gi
            storageClassName: gp3
