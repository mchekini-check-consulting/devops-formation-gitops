global:
  security:
    allowInsecureImages: true

image:
  registry: docker.io
  repository: bitnamilegacy/keycloak

auth:
  adminUser: admin
  existingSecret: keycloak-secret
  passwordSecretKey: KEYCLOAK_ADMIN_PASSWORD

postgresql:
  enabled: false

externalDatabase:
  host: pgcat.prod.svc.cluster.local
  port: 5432
  user: keycloak
  database: keycloak
  existingSecret: keycloak-secret
  existingSecretPasswordKey: KEYCLOAK_DB_PASSWORD

extraEnvVars:
  # pgcat n'implemente pas la negociation SSLRequest sur son listener frontal :
  # il coupe la connexion au lieu de repondre "SSL non supporte", d'ou le besoin
  # de desactiver explicitement le SSL cote client (meme pattern que catalog/order/payment).
  # KC_DB_URL_PROPERTIES seul ne suffit pas (conflit avec ?currentSchema=public deja
  # present dans KC_DB_URL genere par le chart) : on surcharge KC_DB_URL en entier,
  # un env explicite primant sur la valeur venant du ConfigMap (envFrom).
  - name: KC_DB_URL
    value: "jdbc:postgresql://pgcat.prod.svc.cluster.local:5432/keycloak?currentSchema=public&sslmode=disable"
  # Kong termine le TLS en periphérie (keycloak.check-consulting.net) ; Keycloak
  # sert du HTTP en interne mais doit quand meme generer des URLs d'issuer/redirect
  # OIDC en https, d'ou KC_PROXY=edge + KC_HOSTNAME explicite.
  - name: KC_PROXY
    value: "edge"
  - name: KC_HOSTNAME
    value: "https://keycloak.check-consulting.net"

# Expose via Kong (keycloak.check-consulting.net) - plus de NLB dedie
service:
  type: ClusterIP

tls:
  enabled: false

ingress:
  enabled: false

resources:
  requests:
    cpu: 125m
    memory: 512Mi
  limits:
    memory: 1Gi

keycloakConfigCli:
  enabled: true
  existingConfigmap: keycloak-realm-config
  image:
    registry: docker.io
    repository: bitnamilegacy/keycloak-config-cli
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
