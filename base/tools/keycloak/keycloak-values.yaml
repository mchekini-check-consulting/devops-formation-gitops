global:
  security:
    allowInsecureImages: true

image:
  registry: docker.io
  repository: bitnamilegacy/keycloak

auth:
  adminUser: admin
  existingSecret: keycloak-secret
  passwordSecretKey: KEYCLOAK_ADMIN_PASSWORD

postgresql:
  enabled: false

externalDatabase:
  host: pgcat.prod.svc.cluster.local
  port: 5432
  user: keycloak
  database: keycloak
  existingSecret: keycloak-secret
  existingSecretPasswordKey: KEYCLOAK_DB_PASSWORD

extraEnvVars:
  # pgcat n'implemente pas la negociation SSLRequest sur son listener frontal :
  # il coupe la connexion au lieu de repondre "SSL non supporte", d'ou le besoin
  # de desactiver explicitement le SSL cote client (meme pattern que catalog/order/payment).
  # KC_DB_URL_PROPERTIES seul ne suffit pas (conflit avec ?currentSchema=public deja
  # present dans KC_DB_URL genere par le chart) : on surcharge KC_DB_URL en entier,
  # un env explicite primant sur la valeur venant du ConfigMap (envFrom).
  - name: KC_DB_URL
    value: "jdbc:postgresql://pgcat.prod.svc.cluster.local:5432/keycloak?currentSchema=public&sslmode=disable"

service:
  type: LoadBalancer
  ports:
    https: 443
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "external"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    # Auto-decouverte des subnets par tags en echec pour ce service
    # (Evaluated 0 subnets malgre un tagging correct) ; on les specifie
    # explicitement pour contourner le probleme.
    service.beta.kubernetes.io/aws-load-balancer-subnets: "subnet-0b2a9bea0083212a3,subnet-016a482142d66324f,subnet-086e120bd531f1243"

tls:
  enabled: true
  existingSecret: keycloak-tls

ingress:
  enabled: false

resources:
  requests:
    cpu: 40m
    memory: 512Mi
  limits:
    memory: 1Gi

keycloakConfigCli:
  enabled: true
  existingConfigmap: keycloak-realm-config
  image:
    registry: docker.io
    repository: bitnamilegacy/keycloak-config-cli
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
