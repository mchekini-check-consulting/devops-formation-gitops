global:
  security:
    allowInsecureImages: true

image:
  registry: docker.io
  repository: bitnamilegacy/keycloak

auth:
  adminUser: admin
  existingSecret: keycloak-secret
  passwordSecretKey: KEYCLOAK_ADMIN_PASSWORD

postgresql:
  enabled: false

externalDatabase:
  host: pgcat.prod.svc.cluster.local
  port: 5432
  user: keycloak
  database: keycloak
  existingSecret: keycloak-secret
  existingSecretPasswordKey: KEYCLOAK_DB_PASSWORD

service:
  type: LoadBalancer
  ports:
    https: 443
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "external"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    # Auto-decouverte des subnets par tags en echec pour ce service
    # (Evaluated 0 subnets malgre un tagging correct) ; on les specifie
    # explicitement pour contourner le probleme.
    service.beta.kubernetes.io/aws-load-balancer-subnets: "subnet-0b2a9bea0083212a3,subnet-016a482142d66324f,subnet-086e120bd531f1243"

tls:
  enabled: true
  existingSecret: keycloak-tls

ingress:
  enabled: false

resources:
  requests:
    cpu: 125m
    memory: 512Mi
  limits:
    memory: 1Gi

keycloakConfigCli:
  enabled: true
  existingConfigmap: keycloak-realm-config
  image:
    registry: docker.io
    repository: bitnamilegacy/keycloak-config-cli
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
