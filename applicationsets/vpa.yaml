apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vpa
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
    # Source 1 : chart Helm vertical-pod-autoscaler (fairwinds)
    - repoURL: https://charts.fairwinds.com/stable
      chart: vpa
      targetRevision: "*"
      helm:
        valueFiles:
          - $values/base/tools/vpa/vpa-values.yaml
    # Source 2 : ref pour $values
    - repoURL: https://github.com/mchekini-check-consulting/devops-formation-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
