apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: istio-components
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - name: istio-base
            chart: base
            syncWave: "0"
          - name: istio-cni
            chart: cni
            syncWave: "0"
          - name: istio-ztunnel
            chart: ztunnel
            syncWave: "1"
  template:
    metadata:
      name: "{{.name}}"
      annotations:
        argocd.argoproj.io/sync-wave: "{{.syncWave}}"
    spec:
      project: default
      sources:
        - repoURL: https://istio-release.storage.googleapis.com/charts
          chart: "{{.chart}}"
          targetRevision: "~1"
          helm:
            values: |
              profile: ambient
              {{- if eq .name "istio-ztunnel" }}
              # Reels : ~2-14Mi observes par noeud (DaemonSet), le defaut du
              # chart (512Mi request) etait tres surdimensionne.
              resources:
                requests:
                  cpu: 15m
                  memory: 64Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
              {{- end }}
              {{- if eq .name "istio-cni" }}
              # Reels : ~14-27Mi observes par noeud (DaemonSet), le defaut du
              # chart (100Mi request) laissait de la marge inutile.
              resources:
                requests:
                  cpu: 10m
                  memory: 48Mi
                limits:
                  cpu: 50m
                  memory: 96Mi
              {{- end }}
      destination:
        server: https://kubernetes.default.svc
        namespace: istio-system
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
      ignoreDifferences:
        - group: admissionregistration.k8s.io
          kind: ValidatingWebhookConfiguration
          name: istiod-default-validator
          jsonPointers:
            - /webhooks
