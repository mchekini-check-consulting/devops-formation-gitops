apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-ebs-csi
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
    # Manifests statiques : StorageClass gp3 (addon aws-ebs-csi-driver
    # deploye via Terraform, cote IAM/IRSA - voir devops-formation-landing-zone)
    - repoURL: https://github.com/mchekini-check-consulting/devops-formation-gitops.git
      targetRevision: main
      path: base/tools/aws-ebs-csi/manifests/
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
