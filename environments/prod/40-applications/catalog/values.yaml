image:
  tag: 1d6d8ca-main-20260825232205 # sha-slugbranch-timestamp
namespace: prod
replicaCount: 2
resources:
  requests:
    cpu: 15m
    memory: 96Mi
  limits:
    cpu: 50m
    memory: 200Mi
initContainer:
  env:
    - name: DB_HOST
      value: "postgres-primary.prod.svc.cluster.local"
    - name: DB_SSL
      value: "true"
    - name: PGSSLMODE
      value: "no-verify"
    - name: NODE_TLS_REJECT_UNAUTHORIZED
      value: "0"
configmap:
  DB_HOST: "pgcat.prod.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "catalogue"
  DB_SSL: "false"
  PGSSLMODE: "disable"
  CORS_ALLOW_ALL_ORIGINS: "FALSE"
  LOG_LEVEL: "info"
secret:
  enabled: false
externalSecret:
  enabled: true
  vaultPath: prod/catalog
ingress:
  enabled: false
rollout:
  enabled: true
  strategy:
    canary:
      stableService: catalogue
      canaryService: catalogue-canary
      trafficRouting:
        plugins:
          argoproj-labs/gatewayAPI:
            httpRoute: catalogue-httproute
            namespace: prod
      steps:
        - setWeight: 20
        - pause: {duration: 30s}
        - setWeight: 50
        - pause: {duration: 30s}
        - setWeight: 80
        - pause: {duration: 30s}
