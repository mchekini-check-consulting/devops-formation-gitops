image:
  tag: f6198be-main-20260827200433 # sha-slugbranch-timestamp
namespace: prod
replicaCount: 1
resources:
  requests:
    cpu: 10m
    memory: 20Mi
  limits:
    cpu: 200m
    memory: 128Mi
# TLS termine desormais chez Kong (platform-tls, shop.check-consulting.net) -
# plus besoin du cert auto-signe local, l'Ingress qui le consommait est retire.
certificate:
  enabled: false
configmap:
  CATALOG: "https://shop.check-consulting.net/api/products"
  ORDERS: "https://shop.check-consulting.net/api/orders"
  PAYMENT: "https://shop.check-consulting.net/api/payments"
  AUTH_ENABLED: "true"
  KEYCLOAK_URL: "https://keycloak.check-consulting.net"
  KEYCLOAK_REALM: "formation"
  KEYCLOAK_CLIENT_ID: "frontend-app"
ingress:
  enabled: false
rollout:
  enabled: true
  strategy:
    blueGreen:
      activeService: front
      previewService: front-preview
      autoPromotionEnabled: false
      scaleDownDelaySeconds: 600
