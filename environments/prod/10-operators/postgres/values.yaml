namespace: prod

replicaCount: 2

resources:
  requests:
    cpu: 150m
    memory: 256Mi
  limits:
    cpu: 750m
    memory: 1Gi

storage:
  className: gp3
  size: 2Gi

patroni:
  ttl: 30
  loopWait: 10
  retryTimeout: 10
  maxLagOnFailover: 1048576
  postgresql:
    usePgRewind: true
    maxConnections: 150
    walKeepSize: "128MB"
    hotStandbyFeedback: "on"

storageClass:
  create: false
