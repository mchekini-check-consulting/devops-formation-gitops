namespace: dev

replicaCount: 2

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

storage:
  className: gp3
  size: 2Gi

storageClass:
  create: false

patroni:
  ttl: 30
  loopWait: 10
  retryTimeout: 10
  maxLagOnFailover: 1048576
  postgresql:
    usePgRewind: true
    maxConnections: 150
    walKeepSize: "128MB"
    hotStandbyFeedback: "on"

pdb:
  minAvailable: 2
