namespace: dev
replicaCount: 2
resources:
  requests:
    cpu: 10m
    memory: 20Mi
  limits:
    cpu: 50m
    memory: 200Mi
initContainer:
  env:
    - name: DB_HOST
      value: "postgres-primary.dev.svc.cluster.local"
    - name: DB_SSL
      value: "true"
    - name: PGSSLMODE
      value: "no-verify"
    - name: NODE_TLS_REJECT_UNAUTHORIZED
      value: "0"
configmap:
  DB_HOST: "pgcat.dev.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "catalogue"
  DB_SSL: "false"
  PGSSLMODE: "disable"
  CORS_ALLOW_ALL_ORIGINS: "TRUE"
  LOG_LEVEL: "DEBUG"
secret:
  enabled: false
externalSecret:
  enabled: true
  vaultPath: dev/catalog
ingress:
  name: catalogue-ingress-dev
rollout:
  enabled: false
